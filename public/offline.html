<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#72d1f4">
  <title>You’re offline — Fluen</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: #e7f7ff; color: #173d59; font: 16px/1.6 "Segoe UI", Arial, sans-serif; }
    main { width: 100%; max-width: 460px; background: white; border: 1px solid #b6deef;
      border-radius: 26px; padding: 36px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 22px 0 14px; }
    p { color: #4d6e83; margin: 0 0 22px; }
    a { display: inline-block; padding: 12px 24px; border-radius: 16px; background: #1385bd;
      color: white; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #173d59; outline-offset: 4px; }
    .note { margin: 20px 0 0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Fluen" width="72" height="72">
    <h1>A little connection break.</h1>
    <p>Fluen needs an internet connection to open this page. Reconnect, then pick up your practice.</p>
    <a href="">Try again</a>
    <p class="note">Your saved words and progress are kept. AI feedback, conversations, and account sync need a connection.</p>
  </main>
</body>
</html>
