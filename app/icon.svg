<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1180"/>
      <stop offset="100%" stop-color="#141c86"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="6" y1="34" x2="34" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b3ce8"/>
      <stop offset="45%" stop-color="#06a3f0"/>
      <stop offset="100%" stop-color="#16e3a2"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#paper)"/>
  <!-- The wordmark's own f, at favicon scale: the full word is
       illegible at 16px, so the icon carries the first letter only,
       drawn from the identical path so the two never drift apart. -->
  <g transform="translate(6.37 4.33) scale(0.389)"
     fill="none" stroke="url(#ribbon)" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 72V26C30 15 37.5 8.5 47 10.5C52 11.5 56 14.5 58 18.5"/>
    <path d="M12 42C22 38.5 34 41 49 38"/>
  </g>
</svg>
